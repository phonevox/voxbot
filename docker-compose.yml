services:
  bot:
    build: .
    container_name: voxbot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Sobrescreve o POSTGRES_HOST do .env - dentro do compose o banco sempre está em "db"
      # (nome do serviço abaixo), nunca em localhost.
      POSTGRES_HOST: db
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: voxbot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-botdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
