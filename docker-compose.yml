services:
  bot:
    build: .
    container_name: voxbot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Sobrescreve o POSTGRES_HOST/PORT do .env - dentro do compose o banco sempre está em "db:5432"
      # (nome do serviço, porta interna padrão do Postgres). Qualquer POSTGRES_PORT no .env é só o
      # port scheme de host/proxy (Dokploy etc) - o container nunca escuta em outra porta.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - ./logs:/app/logs
    # Publica a porta de ingest do Zabbix direto no host - sem proxy/túnel no meio. A segurança
    # do endpoint é o secret (X-Zabbix-Secret) + allowlist de IP (server.ts), não o bind.
    ports:
      - "${MOD_ZABBIX_INGEST_PORT:-3001}:${MOD_ZABBIX_INGEST_PORT:-3001}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: voxbot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-botdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
